<!-- ==========================================================================
     TRANES — Micrositio «TI / Sistemas» incrustado en SharePoint
     --------------------------------------------------------------------------
     COPIA Y PEGA ESTE CÓDIGO EN EL SCRIPT EDITOR / EMBED DE SHAREPOINT
     
     ¿Por qué esta versión es perfecta?
     1. Altura base de 3550px: si SharePoint bloquea o retrasa los scripts,
        la página NO SE CORTA A LA MITAD; se muestra completa desde el segundo 0.
     2. Sin scroll interno forzado: el banner hero y la barra quedan arriba
        y el usuario se desplaza naturalmente por toda la página.
     3. Auto-ajuste dinámico: si el script se ejecuta, ajusta la altura exacta.
     ========================================================================== -->
<iframe id="tranesFrame"
  title="Micrositio TI / Sistemas TRANES"
  src="https://aprendizti2-code.github.io/Sharepoint-Proyect/ti-sistemas.html"
  style="width: 100%; height: 3550px; min-height: 3550px; border: 0; display: block; overflow: hidden;"
  scrolling="no">
</iframe>

<script>
(function () {
  var f = document.getElementById('tranesFrame');
  if (!f) return;

  function setHeight(h) {
    if (!h || isNaN(h)) return;
    var finalHeight = Math.max(3400, Math.ceil(h));
    f.style.height = finalHeight + 'px';
    f.style.minHeight = finalHeight + 'px';
  }

  // Escuchar mensaje del iframe de GitHub Pages
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.tranes !== 1 || !e.data.height) return;
    setHeight(e.data.height);
  });
})();
</script>
